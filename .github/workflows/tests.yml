name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        # ingests the real committed docs_corpus/ into a temp Chroma dir via
        # fixtures (see tests/conftest.py) -- no network calls, no API key
        run: pytest tests/ -v
      - name: Run the offline demo (smoke test)
        run: python scripts/run_demo.py
